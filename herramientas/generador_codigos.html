<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador de códigos</title>
<style>body{font:16px system-ui;background:#0a1020;color:#e8f0ff;margin:0;padding:16px}select,input,button,textarea{font:inherit;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #4a6fb0;background:#14203a;color:#fff}button{background:#2a5fd0}textarea{height:260px;font-family:monospace}</style></head><body>
<h3>Generador de códigos · Universo Abierto</h3>
<select id="p"></select><input id="n" type="number" value="5" min="1" max="200"><button id="g">GENERAR</button><button id="c">COPIAR</button><textarea id="o" readonly></textarea>
<small>Cada código es de un solo uso. Guarda los que ya vendiste.</small>
<script>
var T={PAQUETES:[]};
  T.PAQUETES = [
    { id: 'muros_s', n: 'Paquete de muros S', d: '10 muros + 2 portones', def: { muro: 10, porton: 2 } },
    { id: 'muros_l', n: 'Paquete de muros L', d: '30 muros + 6 portones', def: { muro: 30, porton: 6 } },
    { id: 'torretas_s', n: 'Paquete de torretas S', d: '4 torretas futuristas', def: { torretaf: 4 } },
    { id: 'torretas_l', n: 'Paquete de torretas L', d: '12 torretas futuristas', def: { torretaf: 12 } },
    { id: 'minerales_s', n: 'Minerales S', d: '300 piedra · 100 hierro · 50 cobre · 10 titanio · 2 oro', inv: { piedra: 300, hierro: 100, cobre: 50, titanio: 10, oro: 2 } },
    { id: 'minerales_l', n: 'Minerales L', d: '1500 piedra · 500 hierro · 250 cobre · 60 titanio · 12 oro', inv: { piedra: 1500, hierro: 500, cobre: 250, titanio: 60, oro: 12 } },
    { id: 'piezas_s', n: 'Piezas de nave S', d: '40 piezas', inv: { piezas: 40 } },
    { id: 'piezas_l', n: 'Piezas de nave L', d: '200 piezas', inv: { piezas: 200 } },
    { id: 'dev', n: 'Modo desarrollador', d: 'Todo desbloqueado y construcción gratis', dev: true, oculto: true }
  ];
var ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SAL='UA-torisoft-2026';
  function h(s, seed) { var x = seed >>> 0; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; }
  function chk(p) { var a = h(p + SAL, 2166136261), b = h(SAL + p, 0x9e3779b1), v = (a ^ b) >>> 0, r = '', i; for (i = 0; i < 4; i++) { r += ALF[v & 31]; v >>>= 5; } return r; }
  T.generar = function (idx, serial) { var p = ALF[idx >> 5 & 31] + ALF[idx & 31] + serial; var c = p + chk(p); return c.slice(0, 4) + '-' + c.slice(4, 8) + '-' + c.slice(8); };

T.generar=function(idx,serial){var p=ALF[idx>>5&31]+ALF[idx&31]+serial;var c=p+chk(p);return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);};
var s=document.getElementById('p');T.PAQUETES.forEach(function(q,i){var o=document.createElement('option');o.value=i;o.textContent=q.n+' — '+q.d;s.appendChild(o);});
document.getElementById('g').onclick=function(){var n=+document.getElementById('n').value||1,r=[],i,j,sr,b=new Uint8Array(6);for(i=0;i<n;i++){crypto.getRandomValues(b);sr='';for(j=0;j<6;j++)sr+=ALF[b[j]&31];r.push(T.generar(+s.value,sr));}document.getElementById('o').value=r.join('\n');};
document.getElementById('c').onclick=function(){var o=document.getElementById('o');o.select();try{document.execCommand('copy');}catch(e){}};
</script></body></html>
